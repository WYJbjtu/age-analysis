name: Data source / ingestion
description: Track one official dataset and its integration
labels: []
body:
  - type: textarea
    id: objective
    attributes:
      label: Scope and target variables
      description: Region-year coverage; owner; required columns
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Official source, table identifier, reference period
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] CSV follows docs/data_contract.md
        - [ ] Source coverage and missingness reported
        - [ ] Validation passes
        - [ ] Findings and limitations documented
