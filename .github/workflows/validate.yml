name: Validate data contracts
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Validate tables
        run: python scripts/validate_data.py
      - name: Verify portable integrity (read-only)
        run: python scripts/remediation_state.py
      - name: Unit tests
        run: python -m pytest -q
      - name: Main analysis regression (read-only)
        run: python scripts/verify_remediation.py regression --no-write
