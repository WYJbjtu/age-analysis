[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aging-across-economies"
version = "0.1.0"
description = "Reproducible Japan–United States regional aging/industry EDA for a course poster"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1,<3", "numpy>=1.24,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
